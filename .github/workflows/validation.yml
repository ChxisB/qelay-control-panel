name: Complete validation

# Every check of `bun run quality` plus the browser and native suites, fanned
# out into independent jobs so the slowest one, not their sum, sets the pace.
# The `quality:*` scripts in package.json are the single source of truth: CI
# runs exactly the groups that `bun run quality` chains locally.

on:
  workflow_call:
    inputs:
      release_artifacts:
        description: Keep tested executables for the release job in this run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Type checking runs once, in the static job; the bundle needs only Vite.
      - name: Build the production bundle
        run: bunx vite build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  quality:
    name: Quality (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # static: version, file size, lint/format, typecheck + build, bundle budget, docs, audit
        # unit: unit tests with the aggregate and critical coverage floors
        # runtime-*: real Bunqueue Flow, Workflow, Queue, PostgreSQL, package and soak runs
        group: [static, unit, runtime-a, runtime-b, runtime-c, runtime-d]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run quality:${{ matrix.group }}
        run: bun run quality:${{ matrix.group }}

  browser-e2e:
    name: Browser E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: chromium, browser: chromium, app: true, run: 'bunx playwright test --project=chromium' }
          - { suite: firefox, browser: firefox, app: true, run: 'bunx playwright test --project=firefox' }
          - { suite: webkit, browser: webkit, app: true, run: 'bunx playwright test --project=webkit' }
          # Managed server, Workflow, Copilot, MCP and S3 (real MinIO) suite.
          - { suite: managed, browser: chromium, app: true, run: 'bunx playwright test -c playwright.managed.config.ts' }
          # Three-broker PostgreSQL Dashboard suite.
          - { suite: postgres-fleet, browser: chromium, app: true, run: 'bun run test:e2e:browser:postgres-fleet' }
          # Documentation URLs, hydration and navigation (builds the docs itself).
          - { suite: docs, browser: chromium, app: false, run: 'bun run test:e2e:docs' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}

      - name: Install browser and OS dependencies
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Build production browser fixture
        if: matrix.app
        run: bunx vite build && bun scripts/gen-embed.ts

      - name: Run ${{ matrix.suite }} E2E
        run: ${{ matrix.run }}

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}-${{ github.sha }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Native binary (${{ matrix.platform }})
    # Only the bundle is needed, so compilation starts as soon as it is built.
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64, suffix: '' }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64, suffix: '' }
          - { platform: darwin-x64, runner: macos-15-intel, arch: x64, suffix: '' }
          - { platform: darwin-arm64, runner: macos-15, arch: arm64, suffix: '' }
          - { platform: windows-x64, runner: windows-2025, arch: x64, suffix: '.exe' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify native architecture and runtime
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          bun run version:check
          bun -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Native architecture mismatch"); console.log(process.platform, process.arch, Bun.version)'
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - name: Compile native release artifact
        run: |
          bun scripts/gen-embed.ts
          bun build scripts/serve.ts agent/dbReadWorker.ts agent/backup/standaloneWorker.ts --compile --minify --target=bun-${{ matrix.platform }} --outfile bunqueue-dashboard-${{ matrix.platform }}${{ matrix.suffix }}
      - name: Execute the exact artifact with no Bun on PATH
        run: bun scripts/validate-standalone-runtime.ts ./bunqueue-dashboard-${{ matrix.platform }}${{ matrix.suffix }}
      - name: Upload tested executable
        if: inputs.release_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: bunqueue-dashboard-${{ matrix.platform }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1
