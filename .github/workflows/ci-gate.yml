name: Commit gate

# On a push to main, ci.yml already runs the complete validation for this exact
# commit. Deploy workflows wait for its Stability gate instead of running the
# same validation a second time (and competing with it for runners). Every other
# trigger (version tags, manual runs) still runs the complete validation itself.

on:
  workflow_call:

permissions:
  contents: read
  checks: read

jobs:
  validation:
    name: Validation
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    uses: ./.github/workflows/validation.yml

  ci:
    name: CI Stability gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the CI Stability gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 170); do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Stability%20gate&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | "\(.status) \(.conclusion)"' || echo 'unknown')
            case "$state" in
              'completed success') echo "CI Stability gate passed for $SHA"; exit 0 ;;
              completed*) echo "CI Stability gate concluded: $state"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the CI Stability gate of $SHA"
          exit 1
