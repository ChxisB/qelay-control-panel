<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <!-- The standalone server rewrites this validated root to BASE_PATH. It
         also keeps relative build assets rooted correctly on static SPA deep links. -->
    <base href="/" data-bunqueue-base />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Pre-paint theme: apply the persisted choice before the bundle loads so
      // light-theme users don't get a dark first-paint flash on every visit.
      // Key + shape must match themeStore (zustand persist: {state:{theme}}).
      // The second key is the pre-rebrand one; themeStore migrates it on hydration.
      try {
        const t = JSON.parse(
          localStorage.getItem('qelay-theme') ?? localStorage.getItem('bq-dash-theme')
        ).state.theme;
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <title>Qelay Control Panel</title>
    <meta
      name="description"
      content="Free, open-source control panel for a bunqueue server: queues, jobs, DLQ, cron, workers and the server process, live. Try the demo, no server needed."
    />
    <!-- CONFIRM: canonical, og:url and og:image use the Pages URL derived from the repo
         (ChxisB/qelay-control-panel). Replace them all once the real host is known;
         scrapers cache these URLs. -->
    <link rel="canonical" href="https://chxisb.github.io/qelay-control-panel/" />
    <!-- Social cards. The demo URL is the project's most-shared link, so it must
         unfurl with a real image/description on Twitter/Slack/Reddit/LinkedIn.
         og:image is an absolute URL (scrapers don't resolve base-relative paths);
         the image is hosted on Pages and loads from there for any deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qelay Control Panel" />
    <meta property="og:title" content="Qelay Control Panel" />
    <meta
      property="og:description"
      content="Drive a bunqueue server from one UI: queues, jobs, DLQ, cron, webhooks, workers, live activity, and start/stop/restart of the server itself. Live demo, no signup."
    />
    <meta property="og:url" content="https://chxisb.github.io/qelay-control-panel/" />
    <meta property="og:image" content="https://chxisb.github.io/qelay-control-panel/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Qelay mark and wordmark on a dark ground, with the line: Drive a bunqueue server from one UI."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qelay Control Panel" />
    <meta
      name="twitter:description"
      content="Drive a bunqueue server from one UI: queues, jobs, DLQ, cron, webhooks, workers, and start/stop/restart. Live demo, no signup."
    />
    <meta name="twitter:image" content="https://chxisb.github.io/qelay-control-panel/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
